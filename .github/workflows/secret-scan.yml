# PR に含まれる commit と main への push を gitleaks で走査し、secrets（API キー・署名鍵）の混入を止める。
# 個人アカウントのリポジトリでは gitleaks-action のライセンスキーは不要。
name: Secret scan

on:
  pull_request:
  # main への直接 push（台帳・docs は PR を通らない）も走査する。gitleaks-action は push の before..after を見る
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read   # gitleaks-action が PR の commit 一覧を取るのに必要（無いと 403）

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # 第三者 Action は full SHA で固定（tag 差し替えの供給網リスク対策。Dependabot が SHA のまま追従する）
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
